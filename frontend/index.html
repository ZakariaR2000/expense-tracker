<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->


  <!-- 1. Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold" href="#">📊 Expense Tracker</a>

      <!-- Dark Mode -->
      <button id="theme-toggle" class="btn btn-outline-light btn-sm">
        🌙 Dark Mode
      </button>
    </div>
  </nav>

  <div class="container mb-5">

    <div id="alert-container"></div>

    <!-- 2. Summary Cards -->

    <div class="summary-grid">
      <div class="card border-0 shadow-sm text-center p-3">
        <h6 class="text-muted mb-1">Total Expenses</h6>
        <h3 id="total-amount" class="fw-bold text-primary mb-0">$0.00</h3>
      </div>
      <div class="card border-0 shadow-sm text-center p-3">
        <h6 class="text-muted mb-1">Number of expenses</h6>
        <h3 id="total-count" class="fw-bold text-success mb-0">0</h3>
      </div>
      <div class="card border-0 shadow-sm text-center p-3">
        <h6 class="text-muted mb-1">Highest expense</h6>
        <h3 id="max-expense" class="fw-bold text-danger mb-0">$0.00</h3>
      </div>
    </div>


    <!-- 3. Form to Add Expense -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-4">
        <h5 class="card-title mb-3">Add a new expense</h5>

        <form id="expense-form" class="row g-3">
          <div class="col-md-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" id="title" class="form-control" placeholder="e.g. Food" required>
          </div>
          <div class="col-md-3">
            <label for="amount" class="form-label">Amount ($)</label>
            <input type="number" step="0.01" min="0.01" id="amount" class="form-control" placeholder="0.00" required>
          </div>
          <div class="col-md-3">
            <label for="category" class="form-label">Category</label>
            <select id="category" class="form-select" required>
              <option value="" disabled selected>Select the category...</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" id="date" class="form-control" required>
          </div>
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-primary px-4">Add Expense</button>
          </div>
        </form>

      </div>
    </div>

    <!-- 4. Filter & Table Section -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="card-title mb-0">List of expenses</h5>

          <!-- Filter Select -->
          <div class="d-flex align-items-center gap-2" style="max-width: 250px;">
            <label for="category-filter" class="form-label mb-0 text-nowrap">Filtering:</label>
            <select id="category-filter" class="form-select form-select-sm">
              <option value="All">All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div id="loading-spinner" class="text-center my-4 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading ...</span>
          </div>
        </div>

        <!-- 5. Table -->
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="expenses-table-body">

            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- Bootstrap editModal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="edit-form">
          <div class="modal-body">
            <input type="hidden" id="edit-id">
            <div class="mb-3">
              <label for="edit-title" class="form-label">Address</label>
              <input type="text" id="edit-title" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="edit-amount" class="form-label">Amount ($)</label>
              <input type="number" step="0.01" min="0.01" id="edit-amount" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="edit-category" class="form-label">Category</label>
              <select id="edit-category" class="form-select" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="edit-date" class="form-label">Date</label>
              <input type="date" id="edit-date" class="form-control" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
